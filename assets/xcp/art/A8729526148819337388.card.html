const winW=400,winH=560,imgW=400,imgH=370;
class P{
  constructor(x,y,col){
    this.x=x;this.y=y;
    this.px=x;this.py=y;
    this.vx=random(-1,1);this.vy=random(-1,1);
    this.s=random(s*.5,s*1.5);
    this.c=col;this.t={x:x,y:y};
    this.free=0;this.gs=random(.01,.05);this.go=random(TWO_PI);
  }
  q(){
    let dx=this.t.x-this.x,dy=this.t.y-this.y,d=sqrt(dx*dx+dy*dy),sp=3,fc=.2;
    let mag=d<100?map(d,0,100,0,sp):sp;
    dx/=d||1;dy/=d||1;
    dx*=mag;dy*=mag;
    let steerx=dx-this.vx,steery=dy-this.vy,mag2=sqrt(steerx*steerx+steery*steery);
    if(mag2>fc){steerx=steerx/mag2*fc;steery=steery/mag2*fc;}
    return [steerx,steery];
  }
  u(){
    if(this.free){this.vx+=random(-.1,.1);this.vy+=random(-.1,.1);
      this.vx=constrain(this.vx,-4.5,4.5);this.vy=constrain(this.vy,-4.5,4.5);
      this.x+=this.vx;this.y+=this.vy;
      if(this.x<0)this.x=width;if(this.x>width)this.x=0;
      if(this.y<0)this.y=height;if(this.y>height)this.y=0;
    }else{
      let [sx,sy]=this.q();
      this.vx+=sx;this.vy+=sy;
      this.vx=constrain(this.vx,-3,3);this.vy=constrain(this.vy,-3,3);
      this.x+=this.vx;this.y+=this.vy;
    }
  }
  d(){
    let a=map(sin(frameCount*this.gs+this.go),-1,1,150,255);
    fill(red(this.c),green(this.c),blue(this.c),a);
    noStroke();
    ellipse(this.x,this.y,this.s);
  }
}

function setup(){
  let holder=document.querySelector('.cubedpepe-container');
  v=createCanvas(winW,winH);
  p=[];
  i.loadPixels();
 
  let ox=(winW-imgW)/2,oy=(winH-imgH)/2-30;
  let px=i.width,py=i.height,tp=px*py,st=floor(sqrt(tp/m));st=max(1,st);
  for(let x=0;x<px;x+=st){
    for(let y=0;y<py;y+=st){
      let idx=4*(x+y*px),r=i.pixels[idx],g=i.pixels[idx+1],b=i.pixels[idx+2],a=i.pixels[idx+3];
      if(a>50){
        let tx=map(x,0,px,ox,ox+imgW),ty=map(y,0,py,oy,oy+imgH);
        p.push(new P(tx,ty,color(r,g,b)));
        if(p.length>=m)break;
      }
    }
    if(p.length>=m)break;
  }
  c=true;
  // Attach canvas to container, under the title
  if(holder && v.elt.parentElement!==holder){holder.insertBefore(v.elt, holder.firstChild);}
}
function windowResized(){resizeCanvas(winW,winH);setup();}
function draw(){
  background(0);
  for(let k of p){k.u();k.d();}
}
function mouseClicked(){
  if(!isMobile()) toggle();
}
function touchEnded(){
  if(isMobile()){toggle();return false;}
}
function toggle(){
  c=!c;
  for(let k of p) k.free=!c;
  let title = document.getElementById('cubedpepe-title');
  if (!c) {
    title.classList.add('static-glow');
  } else {
    title.classList.remove('static-glow');
  }
}
function isMobile(){
  return (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && width < 767;
}</script></body></html>
