const fs=`precision highp float;
uniform float T;uniform vec2 R;uniform vec3 C;
#define PI 3.14159265

vec2 rot(vec2 a,float d){float s=sin(d),c=cos(d);return vec2(a.x*c-a.y*s,a.x*s+a.y*c);}
float sm(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float El(vec3 p,vec3 c,vec3 r){return(length((p-c)/r)-1.)*min(min(r.x,r.y),r.z);}
float d2(vec2 a,vec2 b){return a.x*b.y-b.x*a.y;}
vec3 gC(vec2 b0,vec2 b1,vec2 b2){float a=d2(b0,b2),b=2.*d2(b1,b0),d=2.*d2(b2,b1),f=b*d-a*a;vec2 d21=b2-b1,d10=b1-b0,d20=b2-b0;vec2 gf=2.*(b*d21+d*d10+a*d20);gf=vec2(gf.y,-gf.x);vec2 pp=-f*gf/dot(gf,gf);vec2 d0p=b0-pp;float ap=d2(d0p,d20),bp=2.*d2(d10,d0p);float t=clamp((ap+bp)/(2.*a+b+d),0.,1.);return vec3(mix(mix(b0,b1,t),mix(b1,b2,t),t),t);}
vec4 BD(vec3 p,vec3 a,vec3 b,vec3 c){vec3 w=normalize(cross(c-b,a-b)),u=normalize(c-b),v=normalize(cross(w,u));vec2 a2=vec2(dot(a-b,u),dot(a-b,v)),b2=vec2(0),c2=vec2(dot(c-b,u),dot(c-b,v));vec3 p3=vec3(dot(p-b,u),dot(p-b,v),dot(p-b,w));vec3 cp=gC(a2-p3.xy,b2-p3.xy,c2-p3.xy);return vec4(sqrt(dot(cp.xy,cp.xy)+p3.z*p3.z),cp.z,length(cp.xy),p3.z);}
float bx(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.));}
float pepe(vec3 P){vec3 s=vec3(abs(P.x),P.y,P.z);float h=sm(sm(El(P,vec3(0,0,.05),vec3(1,.8,1)),El(P,vec3(0,-.35,.15),vec3(1.125,.75,1.125)),.1),El(P,vec3(0,-.4,-.35),vec3(1,.8,.75)),.2);h=sm(h,El(s,vec3(.25,.5,.2),vec3(.6,.6,.6)),.1);h=sm(h,max(El(s,vec3(.25,.35,.6),vec3(.6,.4,.5)),-El(s,vec3(.25,.37,.75),vec3(.5,.22,.4))-.05),.05);h=sm(h,sm(El(s,vec3(.25,.37,.75),vec3(.5,.22,.4)),El(s,vec3(.26,.35,.8),vec3(.4,.2,.36)),.001),.01);float eH=.58;h=sm(h,min(BD(s,vec3(0,eH-.05,1),vec3(.5,eH,1),vec3(.7,eH-.15,.85)).x-.05,BD(s,vec3(0,eH-.43,1),vec3(.5,eH-.47,1.1),vec3(.7,eH-.3,.85)).x-.05),.05);float m=-.3;h=sm(h,min(min(BD(s,vec3(0,m,1.3),vec3(.3,m,1.3),vec3(.6,m+.05,1.1)).x,BD(s,vec3(.6,m+.05,1.1),vec3(.9,m-.05,.9),vec3(1,m-.2,.5)).x)-.1,min(BD(s,vec3(0,m-.1,1.3),vec3(.3,m-.1,1.3),vec3(.6,m-.05,1.1)).x,BD(s,vec3(.6,m-.05,1.1),vec3(.9,m-.15,.9),vec3(1,m-.2,.5)).x)-.1),.01);h=sm(h,BD(s,vec3(.95,m-.1,.4),vec3(1.15,m-.2,.3),vec3(.95,m-.3,.4)).x-.1,.1);return h;}
vec2 cornMap(vec3 p){
    vec3 o=vec3(p.y,p.x,p.z);o.x-=.5;vec3 bp=o+vec3(-4.,0.,0.);
    bp.yz=rot(bp.yz,PI*T/2.);bp.x+=(bp.y*bp.y+bp.z*bp.z)/8.;
    float b=bx(bp,vec3(.1,2.,2.));bp.yz=rot(bp.yz,PI/4.);b=min(b,bx(bp,vec3(.1,2.,2.)));
    float stem=bx(bp+vec3(.5,0.,0.),vec3(1.,.5,.5));vec2 st=vec2(atan(o.z,o.y),length(o));
    float x=clamp(.5+(o.x+4.5)/10.,0.,1.);
    float cv=length(o/vec3(2.5-o.x/10.,1.,1.))-2.+(smoothstep(1.,-1.,abs(cos(T*10.+o.x*10.+.6)))/10.*x)+(smoothstep(1.,-1.,abs(cos(st.x*10.)))/10.)*x;
    float r=min(min(cv,b),stem);float m=0.;if(r==cv)m=1.;else if(r==b||r==stem)m=2.;return vec2(r,m);}

vec3 shade(vec3 p,vec3 n,float mt){
    vec3 sun=normalize(vec3(.2,.5,-.5));float dif=clamp(dot(n,sun),0.,1.);float sha=shadow(p+n*.001,sun);float sky=clamp(.5+.5*n.y,0.,1.);float bou=clamp(.5+.5*n.y,0.,1.);

    vec3 ma=mt>1.5?vec3(0.,.125,0.):vec3(1.32,1.,0.);vec3 c=ma*vec3(.5,.6,.5)*dif*sha;c+=ma*vec3(.2,.3,.8)*sky;c+=ma*vec3(.2,.1,.1)*bou;return c;}

    float t=0.;float mt=0.;for(int i=0;i<128;i++){vec2 h=scene(ro+rd*t);mt=h.y;if(h.x<.001)break;t+=h.x;if(t>MD)break;}
    if(t<MD){vec3 p=ro+rd*t,n=scnN(p);vec3 col=shade(p,n,mt);col=pow(max(col,0.),vec3(.4545));gl_FragColor=vec4(col,1.);}
    else{gl_FragColor=vec4(0.);}
}`;
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;

const pa=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pa);gl.vertexAttribPointer(pa,2,gl.FLOAT,false,0,0);
const uT=gl.getUniformLocation(pr,'T'),uR=gl.getUniformLocation(pr,'R'),uC=gl.getUniformLocation(pr,'C');
let aY=0,aX=0,zm=24,dr=false,lx=0,ly=0,td=0,pv=0;
c.onmousedown=e=>{dr=true;lx=e.clientX;ly=e.clientY};
c.addEventListener('mousemove',e=>{if(!dr)return;aY+=(e.clientX-lx)*.01;aX=Math.max(-1.2,Math.min(1.2,aX+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
c.onwheel=e=>{e.preventDefault();zm=Math.max(12,Math.min(40,zm+e.deltaY*.02))};
c.ontouchstart=e=>{if(e.touches.length===1){dr=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY}if(e.touches.length===2){td=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}};
c.ontouchmove=e=>{e.preventDefault();if(e.touches.length===1&&dr){aY+=(e.touches[0].clientX-lx)*.01;aX=Math.max(-1.2,Math.min(1.2,aX+(e.touches[0].clientY-ly)*.005));lx=e.touches[0].clientX;ly=e.touches[0].clientY}if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zm=Math.max(10,Math.min(40,zm+(td-d)*.05));td=d}};
c.ontouchend=()=>dr=false;
addEventListener('mouseup',()=>{dr=false;wDr=false});
</script>

<!-- ===== WIREFRAME COB (Three.js) ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const wc=document.getElementById('wc');wc.width=375;wc.height=520;
const W=new THREE.Scene(),wCam=new THREE.PerspectiveCamera(50,375/520,0.1,100);
const wR=new THREE.WebGLRenderer({canvas:wc,alpha:true,antialias:true});wR.setSize(375,520,false);wR.setClearColor(0,0);
const mY=new THREE.MeshBasicMaterial({color:0xFFFF00,wireframe:true});
const mG=new THREE.MeshBasicMaterial({color:0x008800,wireframe:true});
const mRd=new THREE.MeshBasicMaterial({color:0xFF0000,wireframe:true});
const mW=new THREE.MeshBasicMaterial({color:0xFFFFFF,wireframe:true});
const mB=new THREE.MeshBasicMaterial({color:0x000000,wireframe:true});
const gBright=new THREE.Color(0x00FF00),gBlack=new THREE.Color(0);
const wG=new THREE.Group();W.add(wG);
// Cob - natural corn cob shape: fat cylinder, rounded ends
const cobPts=[];
for(let i=0;i<=24;i++){
    const t=i/24;
    const y=-2.6+t*3.15;
    // Fat cylinder with smoothly rounded ends
    const edge=Math.min(t/.25,1)*Math.min((1-t)/.15,1);
    const mid=1.0+.08*Math.sin(t*Math.PI); // slight middle bulge
    const r=.05+.48*Math.pow(edge,.6)*mid;
    cobPts.push(new THREE.Vector2(r,y));
}
const wCob=new THREE.Mesh(new THREE.LatheGeometry(cobPts,14),mY);wG.add(wCob);
for(let r=0;r<22;r++){const y=-2.4+r*.16;if(y>.5)break;const t=(y+2.6)/3.15;const edge=Math.min(t/.25,1)*Math.min((1-t)/.15,1);const mid=1.0+.08*Math.sin(t*Math.PI);const rad=.07+.5*Math.pow(edge,.6)*mid;const n=Math.max(8,Math.floor(rad*22));for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+(r%2)*Math.PI/n;const k=new THREE.Mesh(new THREE.SphereGeometry(.08,4,4),mY);k.position.set(Math.cos(a)*rad,y,Math.sin(a)*rad);wG.add(k);}}
// Leaves
// Leaves - wide husk shapes like the solid cob
function mkLeaf(ry,bd){
    const segs=10,wSegs=4;
    const verts=[],indices=[];
    for(let i=0;i<=segs;i++){
        const t=i/segs;
        const len=.2+t*.8;
        const y=.55-t*.3+Math.sin(t*Math.PI*.4)*.15;
        const z=0;
        const w=.7*(1-t*.4)*Math.sin(Math.max(t,.1)*Math.PI);
        for(let j=0;j<=wSegs;j++){
            const s=j/wSegs-.5;
            const curl=s*w;
            const yOff=Math.abs(s)*.15*t;
            verts.push(len,y-yOff,curl);
        }
    }
    for(let i=0;i<segs;i++){
        for(let j=0;j<wSegs;j++){
            const a=i*(wSegs+1)+j,b=a+1,c=a+wSegs+1,d=c+1;
            indices.push(a,b,d,a,d,c);
        }
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const lf=new THREE.Mesh(geo,mG);
    lf.rotation.y=ry;
    return lf;
}
const wLvs=[];for(let i=0;i<6;i++){const l=mkLeaf(i*Math.PI/3+.2,.4+Math.random()*.3);l._bY=i*Math.PI/3+.2;l._ph=i*.8;wLvs.push(l);wG.add(l);}
const wCol=new THREE.Mesh(new THREE.CylinderGeometry(.65,.6,.3,10,1),mG);wCol.position.set(0,.55,0);wG.add(wCol);
// Pepe head
const pG=new THREE.Group();pG.position.y=1.3;pG.scale.setScalar(.65);wG.add(pG);
const hd=new THREE.Mesh(new THREE.SphereGeometry(1,12,12),mG);hd.scale.set(1.3,1,1.1);pG.add(hd);
const jw=new THREE.Mesh(new THREE.SphereGeometry(.9,10,10),mG);jw.scale.set(1.35,.7,1.15);jw.position.y=-.45;pG.add(jw);
const bG=new THREE.SphereGeometry(.45,10,10);
const wLB=new THREE.Mesh(bG,mG);wLB.position.set(-.55,.55,.85);pG.add(wLB);
const wRB=new THREE.Mesh(bG,mG);wRB.position.set(.55,.55,.85);pG.add(wRB);
const eG=new THREE.SphereGeometry(.28,10,10);
const wLE=new THREE.Mesh(eG,mW);wLE.position.set(-.55,.55,1.05);pG.add(wLE);
const wRE=new THREE.Mesh(eG,mW);wRE.position.set(.55,.55,1.05);pG.add(wRE);
const puG=new THREE.SphereGeometry(.12,8,8);
const wLP=new THREE.Mesh(puG,mB);wLP.position.set(-.55,.55,1.25);pG.add(wLP);
const wRP=new THREE.Mesh(puG,mB);wRP.position.set(.55,.55,1.25);pG.add(wRP);
// Lips
const mp=[];for(let i=0;i<=20;i++){const t=i/20,x=-0.7+1.4*t,z=1.1*Math.sqrt(Math.max(0,1-Math.pow(x/1.3,2)-.09));mp.push(new THREE.Vector3(x,-.25,z));}
pG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(mp),16,.05,6,false),mRd));
const lp=[];for(let i=0;i<=20;i++){const t=i/20,x=-0.6+1.2*t,z=1.05*Math.sqrt(Math.max(0,1-Math.pow(x/1.2,2)-.2025));lp.push(new THREE.Vector3(x,-.45,z));}
pG.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lp),16,.05,6,false),mRd));
const wNk=new THREE.Mesh(new THREE.CylinderGeometry(.6,.55,.5,10,1),mG);wNk.position.set(0,-.95,0);pG.add(wNk);
let wZm=10;wCam.position.set(0,0,wZm);wCam.lookAt(0,-0.2,0);
let wDr=false,wLx=0,wLy=0;
wc.addEventListener('mousedown',e=>{wDr=true;wLx=e.clientX;wLy=e.clientY});
wc.addEventListener('mousemove',e=>{if(!wDr)return;wG.rotation.y+=(e.clientX-wLx)*.008;wG.rotation.x=Math.max(-1,Math.min(1,wG.rotation.x+(e.clientY-wLy)*.004));wLx=e.clientX;wLy=e.clientY});
wc.addEventListener('wheel',e=>{e.preventDefault();wZm=Math.max(7,Math.min(15,wZm+e.deltaY*.01));wCam.position.z=wZm},{passive:false});
wc.addEventListener('touchstart',e=>{wDr=true;wLx=e.touches[0].clientX;wLy=e.touches[0].clientY},{passive:true});
wc.addEventListener('touchmove',e=>{e.preventDefault();if(!wDr)return;wG.rotation.y+=(e.touches[0].clientX-wLx)*.008;wG.rotation.x=Math.max(-1,Math.min(1,wG.rotation.x+(e.touches[0].clientY-wLy)*.004));wLx=e.touches[0].clientX;wLy=e.touches[0].clientY},{passive:false});
wc.addEventListener('touchend',()=>wDr=false);

// ===== TOGGLE =====
let mode='solid';
document.getElementById('tog').onclick=()=>{
    if(mode==='solid'){mode='wire';c.style.display='none';wc.style.display='block';document.getElementById('tog').textContent='WIRE';}
    else{mode='solid';c.style.display='block';wc.style.display='none';document.getElementById('tog').textContent='SOLID';}
};

// ===== MAIN LOOP =====
let gt=0,wPv=0;
(function loop(t){
    requestAnimationFrame(loop);
    // Solid
    if(mode==='solid'){
        let dt=(t-pv)/1e3;pv=t;if(!dr)aY+=.3*dt;
        gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform1f(uT,t/1e3);gl.uniform2f(uR,375,520);gl.uniform3f(uC,aY,aX,zm);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    // Wire
    if(mode==='wire'){
        if(!wDr){let wdt=(t-wPv)/1e3;wG.rotation.y+=.3*wdt;}wPv=t;
        gt+=.05;
        const g=Math.sin(gt*10)*.5+.5;
        wLP.material.color.lerpColors(gBlack,gBright,g);
        wRP.material.color.lerpColors(gBlack,gBright,g);
        const s=1+g*.2;wLP.scale.setScalar(s);wRP.scale.setScalar(s);
        // Leaves spin faster (PI/2 rad/sec extra, matching solid cob husk rotation)
        const leafSpd=Math.PI/2*t/1000;
        for(let i=0;i<wLvs.length;i++){wLvs[i].rotation.y=wLvs[i]._bY+leafSpd;}
        wR.render(W,wCam);
    }
})(0);
</script></body></html>
