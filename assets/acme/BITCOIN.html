<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sound Money</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;color:#f5e9c8;font-family:Georgia,serif;user-select:none;-webkit-user-select:none}body{background:radial-gradient(ellipse at center,var(--bg,#1a1208),#000 80%)}canvas{display:block;cursor:grab;position:fixed;inset:0}canvas:active{cursor:grabbing}.h{position:fixed;inset:0;pointer-events:none;z-index:10}.h>*{pointer-events:auto}.tl{position:absolute;top:32px;left:36px;line-height:1.1}.t{font-size:46px;font-style:italic;letter-spacing:-.02em;background:linear-gradient(180deg,#fff5c2,#f7c948 40%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(247,201,72,.15)}.s{font-size:13px;margin-top:8px;opacity:.55;letter-spacing:.05em;max-width:340px;font-style:italic}.tr{position:absolute;top:32px;right:36px;text-align:right;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.7}.c{display:block;font-size:34px;font-style:italic;color:#f7c948;margin-top:2px;text-transform:none;opacity:1;letter-spacing:0}.bl{position:absolute;bottom:32px;left:36px;font-size:10px;letter-spacing:.2em;opacity:.5;font-style:italic}.bl b{color:#f7c948;font-style:normal}.bl div{margin-top:4px}.br{position:absolute;bottom:32px;right:36px;display:flex;gap:10px}.b{background:rgba(247,201,72,.06);border:1px solid rgba(247,201,72,.25);color:#f7c948;padding:10px 18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-style:italic;font-family:inherit;transition:all .25s}.b:hover{background:rgba(247,201,72,.15);border-color:#f7c948;color:#fff5c2}.b:active{transform:scale(.97)}.v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7));z-index:5}</style></head><body><canvas id=k></canvas><div class=h><div class=tl><div class=t>Sound Money</div><div class=s>A coin without an issuer. A supply without a sovereign. A ledger without a master.</div></div><div class=tr>Total Supply<span class=c id=ct>0</span></div><div class=bl><div><b>DRAG</b> ⋅ rotate</div><div><b>SCROLL</b> ⋅ zoom</div><div><b>CLICK</b> ⋅ shatter</div></div><div class=br><button class=b id=bs>pause spin</button><button class=b id=bx>shatter</button></div></div><div class=v></div><script>
(()=>{
const k=document.getElementById('k'),x=k.getContext('2d'),P=Math.min(devicePixelRatio||1,2);
let W,H;
function R(){W=innerWidth;H=innerHeight;k.width=W*P;k.height=H*P;k.style.width=W+'px';k.style.height=H+'px';x.setTransform(P,0,0,P,0,0)}
R();addEventListener('resize',R);
function BS(){const S=256,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');g.fillStyle='#fff';g.font='bold 220px Georgia,"Times New Roman",serif';g.textAlign='center';g.textBaseline='middle';g.fillText('₿',S/2,S/2+4);return g.getImageData(0,0,S,S)}
const ST=BS(),M=256,r=1,K=.18,L=.775;
function IL(a,b){const h=r*L,u=(a+h)/(h*2),v=(b+h)/(h*2);if(u<0||u>1||v<0||v>1)return 0;return ST.data[(((v*M)|0)*M+((u*M)|0))*4+3]>128?1:0}
const N=20125;
const h=new Float32Array(N*3),p=new Float32Array(N*3),sd=new Float32Array(N*3),lg=new Uint8Array(N),ph=new Float32Array(N);
(()=>{const f=(N*.85)|0,e=N-f,hf=f/2;let i=0;
for(let n=0;n<f;n++){const j=n%hf,d=r*Math.sqrt(j/hf),a=j*2.39996323,X=d*Math.cos(a),Y=d*Math.sin(a),H=n<hf,Z=(H?1:-1)*K/2,sX=H?-X:X,Lg=IL(sX,Y),z=Z+(Lg?(H?.018:-.018):0);
h[i*3]=X;h[i*3+1]=Y;h[i*3+2]=z;p[i*3]=X;p[i*3+1]=Y;p[i*3+2]=z;lg[i]=Lg;ph[i]=Math.random()*6.283;i++}
const NR=80;for(let n=0;n<e;n++){const ri=n%NR,rz=(n/NR)|0,a=ri/NR*6.283,z=((rz%14)/13-.5)*K*1.1,X=r*.99*Math.cos(a),Y=r*.99*Math.sin(a);
h[i*3]=X;h[i*3+1]=Y;h[i*3+2]=z;p[i*3]=X;p[i*3+1]=Y;p[i*3+2]=z;lg[i]=0;ph[i]=Math.random()*6.283;i++}
for(let i=0;i<N;i++){const a=Math.random()-.5,b=Math.random()-.5,c=Math.random()-.5,m=Math.hypot(a,b,c)||1,sc=1.1+Math.random()*1.9;
sd[i*3]=a/m*sc;sd[i*3+1]=b/m*sc;sd[i*3+2]=c/m*sc}})();
const s={rx:-.3,ry:.4,vx:0,vy:.008,z:2,zT:2,d:0,lx:0,ly:0,t:0,m:0,sh:0,shT:0,sp:1,mx:-9999,my:-9999};
k.addEventListener('pointerdown',e=>{s.d=1;s.lx=e.clientX;s.ly=e.clientY;s.t=performance.now();s.m=0});
addEventListener('pointermove',e=>{s.mx=e.clientX;s.my=e.clientY;if(!s.d)return;const a=e.clientX-s.lx,b=e.clientY-s.ly;s.m+=Math.abs(a)+Math.abs(b);s.vy=a*.005;s.vx=b*.005;s.ry+=s.vy;s.rx+=s.vx;s.lx=e.clientX;s.ly=e.clientY});
addEventListener('pointerup',()=>{if(!s.d)return;s.d=0;if(performance.now()-s.t<220&&s.m<6)SH()});
addEventListener('wheel',e=>{s.zT=Math.max(.8,Math.min(20,s.zT-e.deltaY*.0028));e.preventDefault()},{passive:0});
let AC;
function IA(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)()}
function RS(){if(AC&&AC.state==='suspended')AC.resume()}
function CH(){IA();RS();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
f.type='lowpass';f.frequency.value=2400;
o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(440,t+1.4);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.6)}
function SH(){s.shT=s.shT>.5?0:1;CH()}
document.getElementById('bx').onclick=SH;
document.getElementById('bs').onclick=e=>{s.sp=!s.sp;e.currentTarget.textContent=s.sp?'pause spin':'resume spin'};
const C=document.getElementById('ct');let D=0;
(function tk(){if(D<21e6){D+=Math.max(5e4,(21e6-D)*.04);if(D>21e6)D=21e6;C.textContent=Math.floor(D).toLocaleString();requestAnimationFrame(tk)}else C.textContent='21,000,000'})();
const SC=320,CZ=3.2,SP=64;
function FR(t){
if(!s.d){s.vx*=.95;s.vy*=.95;if(s.sp)s.vy+=(.006-s.vy)*.02;s.rx+=s.vx;s.ry+=s.vy;s.rx+=Math.sin(t*.00035)*.0009}
const dx=Math.sin(t*.00012)*.06;
if(s.rx>1.4)s.rx=1.4;if(s.rx<-1.4)s.rx=-1.4;
s.z+=(s.zT-s.z)*.08;
s.sh+=(s.shT-s.sh)*.05;
if((t|0)%500<17){const hu=30+Math.sin(t*.00007)*8,li=8+Math.sin(t*.00007)*2;document.body.style.setProperty('--bg','hsl('+hu.toFixed(1)+',70%,'+li.toFixed(1)+'%)')}
x.fillStyle='rgba(8,5,2,.25)';x.fillRect(0,0,W,H);
const RX=s.rx+dx,RY=s.ry,cx=Math.cos(RX),sX=Math.sin(RX),cy=Math.cos(RY),sY=Math.sin(RY),OX=W/2,OY=H/2,sc=SC*s.z;
const hg=x.createRadialGradient(OX,OY,sc*.3,OX,OY,sc*1.4);
hg.addColorStop(0,'rgba(247,180,72,.09)');
hg.addColorStop(.5,'rgba(184,134,11,.04)');
hg.addColorStop(1,'rgba(0,0,0,0)');
x.fillStyle=hg;x.fillRect(0,0,W,H);
let lx=0,ly=0,lz=0,uM=0;
if(s.sh<.3&&s.mx>0){const wx=(s.mx-OX)/sc,wy=(s.my-OY)/sc,A=wx*cy,c2=-wx*sY,b2=wy*cx+c2*sX,d2=-wy*sX+c2*cx;lx=A;ly=b2;lz=d2;uM=1}
x.globalCompositeOperation='lighter';x.textAlign='center';x.textBaseline='middle';
for(let i=0;i<N;i++){
const i3=i*3;
let HX=h[i3],HY=h[i3+1],HZ=h[i3+2];
if(s.sh>.001){HX+=sd[i3]*s.sh;HY+=sd[i3+1]*s.sh;HZ+=sd[i3+2]*s.sh}
if(uM){const a=HX-lx,b=HY-ly,c=HZ-lz,d=a*a+b*b+c*c;if(d<.08){const f=(1-d/.08)*.15;HX+=a*f;HY+=b*f;HZ+=c*f}}
const Sl=s.shT>s.sh?.15:.22;p[i3]+=(HX-p[i3])*Sl;p[i3+1]+=(HY-p[i3+1])*Sl;p[i3+2]+=(HZ-p[i3+2])*Sl;
const PX=p[i3],PY=p[i3+1],PZ=p[i3+2];
const r1=PX*cy-PZ*sY,z1=PX*sY+PZ*cy,y2=PY*cx-z1*sX,z2=PY*sX+z1*cx;
const zP=z2+CZ;if(zP<.5)continue;
const pe=sc/zP,SXP=OX+r1*pe,SYP=OY+y2*pe;
const dp=(z2+1.5)/3,tw=.7+.3*Math.sin(t*.002+ph[i]);
let R,G,B,a,sz;
if(lg[i]){R=190+(20*dp)|0;G=95+(15*dp)|0;B=15+(10*dp)|0;a=(.4+.3*dp)*tw;sz=4+pe*.0095}
else{const rr=Math.hypot(h[i3],h[i3+1])/r,br=.55+.45*dp;R=(255-rr*8)*br;G=(201-rr*55)*br;B=(72-rr*60)*br;a=(.5+.5*dp)*tw;sz=2.2+pe*.0045;
if(dp>.55){const sp=Math.max(0,(r1*.7+y2*.3)/sc*100),kk=Math.min(1,sp*.06);R=Math.min(255,R+kk*100);G=Math.min(255,G+kk*90);B=Math.min(255,B+kk*60)}}
if(s.sh>.1){R=Math.min(255,R+30);G=Math.min(255,G+20);B=Math.min(255,B+10)}
if(a<=.005)continue;
x.fillStyle='rgba('+(R|0)+','+(G|0)+','+(B|0)+','+a+')';
x.font='bold '+(Math.max(7,sz)|0)+'px Georgia,serif';
x.fillText('₿',SXP,SYP);
}
x.globalCompositeOperation='source-over';
requestAnimationFrame(FR);
}
requestAnimationFrame(FR);
})();
</script></body></html>
