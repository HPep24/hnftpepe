cols=Math.ceil(W/cellW);rows=Math.ceil(H/cellH);
col=new Array(cols).fill(0).map(()=>Math.random()*rows);
speeds=new Array(cols).fill(0).map(()=>.3+Math.random()*.5);
}
__grid();

c.addEventListener('pointerdown',()=>{setIdx=(setIdx+1)%sets.length;});

let glitchTimer=0,glitchRows=[],glitchActive=false;

x.fillStyle='#000';x.fillRect(0,0,W,H);

let T0=performance.now();
function frame(){
  const T=(performance.now()-T0)*.001;

  // trailing fade like original
  x.fillStyle='rgba(0,0,0,0.10)';x.fillRect(0,0,W,H);

  // random glitch trigger
  if(Math.random()<.012){glitchActive=true;glitchTimer=T+.04+Math.random()*.08;
    glitchRows=[];for(let i=0;i<2+Math.random()*4|0;i++)glitchRows.push(Math.floor(Math.random()*rows));}
  if(T>glitchTimer)glitchActive=false;

  const set=sets[setIdx];
  x.font=`${cellH-2}px ui-monospace,monospace`;
  x.textBaseline='top';

  for(let i=0;i<cols;i++){
    col[i]+=speeds[i];
    if(col[i]>rows+Math.random()*20){col[i]=-Math.random()*15;speeds[i]=.3+Math.random()*.5;}

    const headJ=col[i];

    for(let j=Math.max(0,Math.floor(headJ)-25);j<=Math.min(rows,Math.floor(headJ));j++){
      const yp=j*cellH;
      const cxp=i*cellW;
      const dist=headJ-j;

      // trail brightness: bright at head, fading behind
      let intensity=Math.max(0,1-dist*.04);
      intensity*=.7+.3*Math.sin(T*15+i*7+j*3);
      if(intensity<.03)continue;

      const ch=set[Math.abs((j*7+i*3+(T*4|0))%set.length)];
      const isHead=dist<1;

      // glitch shift
      let gx=0;
      if(glitchActive&&glitchRows.includes(j))gx=(Math.random()-.5)*20*DPR;

      if(isHead){
        x.fillStyle=`rgba(220,255,220,${Math.min(1,intensity)})`;
      }else if(glitchActive&&glitchRows.includes(j)){
        x.fillStyle=`rgba(180,255,180,${Math.min(1,intensity*1.6)})`;
      }else{
        const g=160+Math.floor(intensity*80);
        x.fillStyle=`rgba(0,${g},40,${Math.min(1,intensity*.9)})`;
      }

      x.fillText(ch,cxp+gx,yp);
    }
  }

  requestAnimationFrame(frame);
}
frame();

new ResizeObserver(function(){var s=c.clientWidth||460;c.width=s*DPR;c.height=s*DPR;W=c.width;H=c.height;__grid();x.fillStyle='#000';x.fillRect(0,0,W,H);}).observe(c);})();
</script></body></html>
